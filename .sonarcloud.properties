# SonarQube Cloud automatic analysis settings.
#
# Excluded from duplication detection only (still analysed for bugs, smells and
# security):
# - schema.sql is a generated pg_dump of supabase/migrations, so it repeats
#   every migration by construction.
# - e2e/** is Playwright test code; its fixture/setup helpers are repeated per
#   spec on purpose so each file stays self-contained.
sonar.cpd.exclusions=schema.sql,e2e/**
