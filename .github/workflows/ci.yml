name: CI

on:
  pull_request:
  push:
    branches: [Main, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint src

      # NEXT_PUBLIC_* vars are needed even for a build with no live DB
      # call, since Next.js inlines them into the client bundle at build
      # time; the values just need to be well-formed, not real.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

      # Only the no-auth smoke tests — they don't need a live Supabase/R2
      # (the health check assertion accepts either 200 or 503), so they can
      # run against every PR. The full workflow suite (e2e/auth.spec.ts,
      # e2e/workflows.spec.ts) needs seeded fixtures and is meant to run
      # against a real staging deploy — see e2e/README.md.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npx playwright test smoke.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
